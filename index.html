<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego: Frío, Tibio, Caliente</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
  </script>
  <style type="text/tailwindcss">
    @import "tailwindcss"; 

    @layer base {
      :root {
        @apply text-sm;
        line-height: 1.6;
      }

      body {
        @apply container mx-auto p-5 bg-cyan-700 leading-7 flex items-center justify-center p-4
      }

      main {
        @apply w-5/6 bg-cyan-50 mx-auto p-4 border-2
      }

      h1 {
        @apply font-bold text-white text-xl mb-2
      }
      
      
      p { @apply mb-2 }

      button {
        @apply rounded-md bg-slate-200 border-1 border-slate-400 p-2 m-6 text-sm cursor-help disabled:opacity-50 hover:bg-amber-100
      }
      input {
        @apply border-1 px-2 rounded-md font-sans text-center block mx-auto
      }

      label {
        @apply  text-center block mx-auto my-2
      }

      
    }
    </style>
</head>
<body id="cuerpo" class="bg-cyan-700 min-h-screen flex items-center justify-center transition-colors duration-500">

    <div class="bg-yellow-300 p-10 border-2 text-center shadow-2xl max-w-lg w-full">
        <h1 class="text-4xl text-blue-500 mb-6">Frio / Tibio / Caliente</h1>
        
        <div class="space-y-4">
            <label for="numeroUsuario" class="block text-lg font-medium">Escribe un número entre 1 y 500:</label>
            <input type="number" id="numero" class="border-2 border-gray-400 p-2 text-center w-24 text-xl rounded focus:outline-none focus:border-blue-500" 
                   placeholder="0">
            
            <div id="resultado" class="text-lg font-bold min-h-[3rem] py-2"></div>

            <button id="btnAdivinar" 
                    onclick="revisar()" 
                    class="bg-white border border-gray-300 px-6 py-2 rounded shadow hover:bg-gray-100 flex items-center justify-center mx-auto gap-2">
                <span class="text-red-800">?</span> Adivinar
            </button>
        </div>
    </div>
    <script  src="./js/app.js"></script>
    
</body>
</html>
